name: Publish NuGet Package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Publish NuGet Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore E5Embedding.Net.csproj

      - name: Build
        run: dotnet build E5Embedding.Net.csproj --configuration Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack E5Embedding.Net.csproj \
          --configuration Release \
          --no-build \
          --output ./nupkg

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate