name: .NET CI and NuGet Publish

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal


  publish:
    name: Publish NuGet Package
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack NuGet package
        run: |
          dotnet pack E5Embedding.Net.csproj \
            --configuration Release \
            --output ./nupkg

      - name: Login to NuGet.org using Trusted Publishing
        uses: NuGet/login@v1
        with:
          user: mamadsaeed
          token-service-url: https://api.nuget.org/v3/index.json

      - name: Push package to NuGet.org
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source "nuget.org" \
            --skip-duplicate
